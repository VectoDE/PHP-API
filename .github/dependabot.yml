version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: main
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
