name: tmp-lock

on:
  workflow_dispatch:
  push:
    branches: [deps/php-jwt-7]
    paths: ['.github/workflows/tmp-lock.yml']

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: json, openssl, pdo
          coverage: none
          tools: composer:v2

      - name: Update lock
        run: composer update firebase/php-jwt --with-all-dependencies --no-interaction --no-install --no-scripts

      - name: Upload lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-lock
          path: composer.lock
